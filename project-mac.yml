# XcodeGen spec for the macOS client. Generates LocalProxyMac.xcodeproj, kept
# separate from the hand-edited iOS LocalProxy.xcodeproj so the iOS project is
# never touched:  xcodegen generate --spec project-mac.yml
name: LocalProxyMac

options:
  bundleIdPrefix: com.Korporate1k
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: DS8AMC8BSV
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

packages:
  LWIPTunnelEngine:
    path: LWIPTunnelEngine
  Socks5Client:
    path: Socks5Client

targets:
  LocalProxyMac:
    type: application
    platform: macOS
    sources:
      - path: LocalProxyMac/Sources
      - path: LocalProxyMac/Shared
      - path: LocalProxyMac/Assets.xcassets
      # Shared with the iOS app, compiled unchanged (macOS-only bits are #if guarded).
      - path: LocalProxy/ClientConfiguration.swift
      - path: LocalProxy/KeychainStore.swift
      - path: LocalProxy/ClientTunnelManager.swift
      - path: LocalProxy/Socks5ClientTestView.swift
    dependencies:
      - target: LocalProxyMacTunnel
        embed: true
      - package: Socks5Client
        product: Socks5Client
    settings:
      base:
        PRODUCT_NAME: NetBridge
        PRODUCT_MODULE_NAME: LocalProxyMac
        PRODUCT_BUNDLE_IDENTIFIER: com.Korporate1k.LocalProxy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: LocalProxyMac/Info.plist
      properties:
        CFBundleDisplayName: NetBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSCameraUsageDescription: NetBridge uses the camera to scan another device's QR code.
    entitlements:
      path: LocalProxyMac/LocalProxyMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.Korporate1k.LocalProxy.shared

  LocalProxyMacTunnel:
    type: app-extension
    platform: macOS
    sources:
      - path: LocalProxyTunnel/PacketTunnelProvider.swift
      - path: LocalProxyMac/Shared
    dependencies:
      - package: LWIPTunnelEngine
        product: LWIPTunnelEngine
    settings:
      base:
        PRODUCT_NAME: LocalProxyTunnel
        PRODUCT_MODULE_NAME: LocalProxyTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.Korporate1k.LocalProxy.Tunnel
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: LocalProxyMacTunnel/Info.plist
      properties:
        CFBundleDisplayName: NetBridge Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: LocalProxyMacTunnel/LocalProxyMacTunnel.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # UDP sessions (SOCKS5 UDP ASSOCIATE) bind + receive on a socket; without
        # the server entitlement the sandbox fails them with EPERM (os error 1).
        com.apple.security.network.server: true
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.Korporate1k.LocalProxy.shared

schemes:
  LocalProxyMac:
    build:
      targets:
        LocalProxyMac: all
        LocalProxyMacTunnel: all
    run:
      config: Debug
    archive:
      config: Release
