# XcodeGen spec for the macOS client. Generates NetBridgeMac.xcodeproj, kept
# separate from the hand-edited iOS NetBridge.xcodeproj so the iOS project is
# never touched:  xcodegen generate --spec project-mac.yml
name: NetBridgeMac

options:
  bundleIdPrefix: com.Korporate1k
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: DS8AMC8BSV
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # Apple Silicon only: the tun2proxy xcframework has just a macos-arm64 slice
    # (scripts/build-tun2proxy-macos.sh), so a universal archive can't link.
    ARCHS: arm64

packages:
  LWIPTunnelEngine:
    path: LWIPTunnelEngine
  Socks5Client:
    path: Socks5Client

targets:
  NetBridgeMac:
    type: application
    platform: macOS
    sources:
      - path: NetBridgeMac/Sources
      - path: NetBridgeMac/Shared
      - path: NetBridgeMac/Assets.xcassets
      # Shared with the iOS app, compiled unchanged (macOS-only bits are #if guarded).
      - path: NetBridge/ClientConfiguration.swift
      - path: NetBridge/KeychainStore.swift
      - path: NetBridge/ClientTunnelManager.swift
      - path: NetBridge/Socks5ClientTestView.swift
    dependencies:
      - target: NetBridgeMacTunnel
        embed: true
      - package: Socks5Client
        product: Socks5Client
    settings:
      base:
        PRODUCT_NAME: NetBridge
        PRODUCT_MODULE_NAME: NetBridgeMac
        PRODUCT_BUNDLE_IDENTIFIER: com.Korporate1k.LocalProxy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: NetBridgeMac/Info.plist
      properties:
        CFBundleDisplayName: NetBridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSCameraUsageDescription: NetBridge uses the camera to scan another device's QR code.
    entitlements:
      path: NetBridgeMac/NetBridgeMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.camera: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.Korporate1k.LocalProxy.shared

  NetBridgeMacTunnel:
    type: app-extension
    platform: macOS
    sources:
      - path: NetBridgeTunnel/PacketTunnelProvider.swift
      - path: NetBridgeMac/Shared
    dependencies:
      - package: LWIPTunnelEngine
        product: LWIPTunnelEngine
    settings:
      base:
        PRODUCT_NAME: NetBridgeTunnel
        PRODUCT_MODULE_NAME: NetBridgeTunnel
        PRODUCT_BUNDLE_IDENTIFIER: com.Korporate1k.LocalProxy.Tunnel
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: NetBridgeMacTunnel/Info.plist
      properties:
        CFBundleDisplayName: NetBridge Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: NetBridgeMacTunnel/NetBridgeMacTunnel.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # UDP sessions (SOCKS5 UDP ASSOCIATE) bind + receive on a socket; without
        # the server entitlement the sandbox fails them with EPERM (os error 1).
        com.apple.security.network.server: true
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.Korporate1k.LocalProxy.shared

schemes:
  NetBridgeMac:
    build:
      targets:
        NetBridgeMac: all
        NetBridgeMacTunnel: all
    run:
      config: Debug
    archive:
      config: Release
